services:
  # Redis for Celery and caching
  redis:
    image: redis:7-alpine
    container_name: videobot_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Video Bot Application
  videobot:
    build: .
    container_name: videobot_app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - video_temp:/tmp/videos
      - processed_temp:/tmp/processed
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Celery Worker for video processing
  celery_worker:
    build: .
    container_name: videobot_celery_worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - video_temp:/tmp/videos
      - processed_temp:/tmp/processed
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Flower for Celery monitoring (optional) - temporarily disabled
  # flower:
  #   build: .
  #   container_name: videobot_flower
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     - CELERY_BROKER_URL=redis://redis:6379/1
  #     - CELERY_RESULT_BACKEND=redis://redis:6379/2
  #   ports:
  #     - "5555:5555"
  #   command: celery -A app.workers.celery_app flower --port=5555
  #   restart: unless-stopped

volumes:
  redis_data:
  video_temp:
  processed_temp:

networks:
  default:
    name: videobot_network 